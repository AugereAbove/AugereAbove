name: Refresh profile activity

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_activity.py
      - tests/test_activity.py
      - .github/workflows/profile-summary-cards.yml

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Test the generator
        run: python3 -m unittest discover -s tests -v
      - name: Read public activity and generate cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_activity.py --user AugereAbove
      - name: Commit updated cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name AugereAbove
          git config user.email 238561773+AugereAbove@users.noreply.github.com
          git add assets/activity
          if git diff --cached --quiet; then
            echo "Public activity cards are current."
            exit 0
          fi
          git commit -m "Refresh public GitHub activity"
          gh auth setup-git
          git push origin HEAD:main
