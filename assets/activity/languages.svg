<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc"><title id="title">Primary language by public repository</title><desc id="desc">Each public nonfork repository is counted once. Unclassified means GitHub reports no primary language.</desc><rect x="0.5" y="0.5" width="439" height="259" rx="14" fill="#0d1117" stroke="#303b4c"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="24" y="32" fill="#70bdff" font-size="15" font-weight="600" text-anchor="start">REPOSITORIES BY LANGUAGE</text><text x="24" y="68" fill="#e6edf3" font-size="13" font-weight="400" text-anchor="start">Python</text><text x="414" y="68" fill="#9aa9bb" font-size="12" font-weight="400" text-anchor="end">5 / 9</text><rect x="24" y="76" width="390" height="7" rx="3" fill="#1b2636"/><rect x="24" y="76" width="216.7" height="7" rx="3" fill="#61afef"/><text x="24" y="100" fill="#e6edf3" font-size="13" font-weight="400" text-anchor="start">Unclassified</text><text x="414" y="100" fill="#9aa9bb" font-size="12" font-weight="400" text-anchor="end">3 / 9</text><rect x="24" y="108" width="390" height="7" rx="3" fill="#1b2636"/><rect x="24" y="108" width="130.0" height="7" rx="3" fill="#68788c"/><text x="24" y="132" fill="#e6edf3" font-size="13" font-weight="400" text-anchor="start">TypeScript</text><text x="414" y="132" fill="#9aa9bb" font-size="12" font-weight="400" text-anchor="end">1 / 9</text><rect x="24" y="140" width="390" height="7" rx="3" fill="#1b2636"/><rect x="24" y="140" width="43.3" height="7" rx="3" fill="#638fee"/><text x="24" y="236" fill="#9aa9bb" font-size="11" font-weight="400" text-anchor="start">Primary language per repo Â· not a skill score</text></g></svg>
